[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansi-pixel"
version = "0.2.0"
description = "Convert images into true-color ANSI art for terminal banners, SSH previews, and Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Senura Hesara", email = "neophytetoskill@gmail.com" },
]
keywords = [
    "ansi",
    "terminal",
    "image",
    "converter",
    "true-color",
    "ascii-art",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/senurah/ansi-pixel"
Repository = "https://github.com/senurah/ansi-pixel"
Issues = "https://github.com/senurah/ansi-pixel/issues"

[project.scripts]
ansi-pixel = "ansi_pixel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ansi_pixel"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
